model:
  # BitNet Text Encoder (LARGER Model for GPU Utilization)
  vocab_size: 50257 # GPT-2 vocabulary
  text_encoder_dim: 512 # DOUBLED for more GPU work (was 256)
  text_encoder_layers: 8 # DOUBLED for more GPU computation (was 4)
  text_encoder_heads: 8 # DOUBLED for more GPU parallelism (was 4)

  # BitNet Text Decoder (LARGER Model for GPU Utilization)
  text_decoder_dim: 512 # DOUBLED for more GPU work (was 256)
  text_decoder_layers: 8 # DOUBLED for more GPU computation (was 4)
  text_decoder_heads: 8 # DOUBLED for more GPU parallelism (was 4)

  # Vision processing (DiNOv2 features - LARGER for GPU Utilization)
  vision_encoder_dim: 768 # DiNOv2 feature dimension (fixed)
  vision_latent_size: 512 # DOUBLED for more GPU work (was 256)
  vision_hidden_size: 256 # DOUBLED for more GPU computation (was 128)

  # QFormer-inspired Cross-modal fusion with Quadrangle Attention (LARGER)
  fusion_hidden_size: 512 # DOUBLED for more GPU work (was 256)
  fusion_num_heads: 8 # DOUBLED for more GPU parallelism (was 4)
  fusion_num_layers: 4 # DOUBLED for more GPU computation (was 2)
  fusion_num_queries: 64 # DOUBLED for more complex queries (was 32)

  # Quadrangle Attention Configuration (NEW)
  use_quadrangle_attention: true # Enable QFormer's Quadrangle Attention mechanism
  quadrangle_memory_size: 1024 # Dedicated memory for quadrangle attention episodic processing

  # Episodic Memory (LARGER for GPU Utilization)
  memory_size: 64 # QUADRUPLED memory slots for more GPU work (was 16)
  episode_dim: 512 # DOUBLED episode dimension for more GPU computation (was 256)
  memory_alpha: 0.15 # Slightly higher for faster adaptation with fewer slots
  direct_writing: true

  # Model configuration - Optimized for 10 epochs full dataset
  max_seq_len: 128 # Increased for better performance
  dropout: 0.1 # Lower dropout for better learning

data:
  # Dataset configuration - FULL DATASET FOR BEST RESULTS
  dataset_dir: "../babylm_dataset"
  text_encoder_name: "gpt2"
  max_seq_length: 256 # DOUBLED for more GPU work and better understanding (was 128)

  # DataLoader settings - EXTREME GPU UTILIZATION with MULTI-WORKER SUPPORT (H5py eliminated!)
  batch_size: 64 # TRIPLED batch size for maximum VRAM utilization (was 24)
  num_workers: 8 # 🚀 MULTI-WORKER ENABLED! (h5py constraint eliminated)
  pin_memory: true
  persistent_workers: true # Keep workers alive for efficiency
  prefetch_factor: 16 # DOUBLED prefetch for continuous GPU saturation (was 8)

  # Full dataset training (no sample limits)
  # max_samples: null  # Train on entire dataset for best results
  text_ratio: 0.5 # Balanced text and multimodal training

  # HuggingFace configuration (use environment variables)
  hf_token: null # Use HF_TOKEN environment variable
  validation_datasets:
    - "squad" # Public dataset, no auth required
    - "glue/sst2" # Public dataset, no auth required

training:
  # Training configuration - 10 EPOCHS with EXTREME GPU UTILIZATION
  max_epochs: 10
  accumulate_grad_batches: 1 # REDUCED due to much larger batch size (64)
  gradient_clip_val: 1.0
  val_check_interval: 200 # Less frequent validation for speed
  scheduler: "cosine"
  min_lr: 0.00001
  warmup_steps: 300 # Reduced warmup for faster training
  learning_rate: 0.001 # INCREASED learning rate for faster convergence
  weight_decay: 0.01

  # EXTREME GPU UTILIZATION settings for RTX A6000
  gradient_accumulation_steps: 1 # REDUCED due to much larger batches (effective = 64*1=64)
  save_every_n_epochs: 2 # Save checkpoints every 2 epochs
  use_mixed_precision: true # Enable for RTX A6000
  use_gradient_checkpointing: false # DISABLED to maximize speed over memory
  compile_model: false # Disabled for stability

# Weights & Biases configuration - OPTIMIZED FOR SPEED
# Enhanced wandb configuration with minimal logging for speed
wandb:
  project: "bitmar-babylm-edge"
  entity: "babylm-ntust" # Use babylm-ntust team
  api_key: null # Use WANDB_API_KEY environment variable
  log_every_n_steps: 500 # Much less frequent logging (was 50)
  save_code: true

# Evaluation settings
evaluation:
  metrics: ["bleu", "rouge", "cross_modal_accuracy"]
  generate_samples: true
  num_samples: 100
  max_generation_length: 100
  temperature: 0.7
  top_p: 0.9

# Output directories
output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  results_dir: "results"

# CPU testing configuration (Tiny Model)
cpu_test:
  batch_size: 2
  max_samples: 100
  reduced_model_size: true
  memory_size: 8 # Ultra-tiny: 8 slots for CPU testing
